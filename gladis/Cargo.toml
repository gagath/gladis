[package]
name = "gladis"
version = "2.1.3"
authors = ["Agathe Porte <microjoe@microjoe.org>"]
edition = "2018"
license = "MIT OR Apache-2.0"
description = "DEPRECATED. Use gtk-rs's CompositeTemplate derive macro instead."
readme = "README.md"
keywords = ["gui", "gtk", "gtk-rs", "gnome", "glade"]
categories = ["gui"]
repository = "https://github.com/gagath/gladis"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gladis_proc_macro = { version = "2.1.2", optional = true, path = "../gladis_proc_macro" }
gtk = { git = "https://github.com/nikescar/gtk3-rs.git", version = "0.19.0" }

[dev-dependencies]
gladis_proc_macro = { version = "2.1.2", path = "../gladis_proc_macro" }
gio = "0.22.6"

# Relm example
relm = { git = "https://github.com/coyoteclan/relm.git", version = "0.24.1" }
relm-derive = { git = "https://github.com/coyoteclan/relm.git", version = "0.24.0" }

[features]
default = ["derive"]
derive = ["gladis_proc_macro"]
